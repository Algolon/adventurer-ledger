name: Verify

# Runs the full clean-checkout verification on every pull request and on every
# pushed branch, so a PR head is certified remotely rather than only locally.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A clean checkout must typecheck before anything has generated .next.
      # Committing a build artifact that tsconfig depends on would break this.
      - name: Assert no pre-existing build output
        run: |
          for path in .next out; do
            if [ -e "$path" ]; then
              echo "::error::$path exists in a clean checkout; a generated artifact is committed"
              exit 1
            fi
          done

      - name: Typecheck without any build output
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Verify scoped static artifact
        run: npm run verify:pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Root, Pages, and controlled-update browser tests
        run: npm run test:e2e:all

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Privacy boundary scan
        run: npm run privacy:scan

      - name: Whitespace and conflict-marker check
        run: git diff --check

      # Generated files must not be tracked: after a full build the working tree
      # is still clean, so no build artifact can drift into committed source.
      - name: Assert the build left no tracked-file drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A build modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
